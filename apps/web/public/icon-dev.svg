<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity=".1" stroke-width="1"/>
    </pattern>
    <pattern id="grid-major" width="128" height="128" patternUnits="userSpaceOnUse">
      <path d="M128 0H0V128" fill="none" stroke="#ffffff" stroke-opacity=".18" stroke-width="1.5"/>
    </pattern>
    <clipPath id="tile"><rect width="512" height="512" rx="112"/></clipPath>
  </defs>
  <g clip-path="url(#tile)">
    <rect width="512" height="512" fill="#1c3f9e"/>
    <rect width="512" height="512" fill="url(#grid)"/>
    <rect width="512" height="512" fill="url(#grid-major)"/>
    <circle cx="256" cy="270" r="196" fill="none" stroke="#ffffff" stroke-opacity=".24" stroke-width="1.5"/>
    <circle cx="256" cy="270" r="140" fill="none" stroke="#ffffff" stroke-opacity=".16" stroke-width="1.5"
      stroke-dasharray="6 10"/>
    <path d="M0 270H512M256 0V512" fill="none" stroke="#ffffff" stroke-opacity=".2" stroke-width="1.5"
      stroke-dasharray="10 12"/>
    <g transform="rotate(-8 256 270)">
      <!-- The back card's ghost, then the card itself as a wireframe on the grid. -->
      <rect x="140" y="120" width="232" height="300" rx="28" fill="none" stroke="#7fd4ff" stroke-opacity=".55"
        stroke-width="2" stroke-dasharray="6 8"/>
      <rect x="140" y="110" width="232" height="300" rx="28" fill="#ffffff" fill-opacity=".08" stroke="#ffffff"
        stroke-width="3"/>
      <path d="M190 200h132M190 250h96" fill="none" stroke="#ffffff" stroke-opacity=".92" stroke-width="14"
        stroke-linecap="round"/>
      <path d="M190 320h132" fill="none" stroke="#7fd4ff" stroke-width="14" stroke-linecap="round"
        stroke-dasharray="2 22"/>
      <g fill="#7fd4ff">
        <circle cx="140" cy="110" r="5"/>
        <circle cx="372" cy="110" r="5"/>
        <circle cx="140" cy="410" r="5"/>
        <circle cx="372" cy="410" r="5"/>
      </g>
    </g>
  </g>
</svg>
