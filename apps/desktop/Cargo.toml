[package]
name = "recall-desktop"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

# Its own workspace: Rune's dependency tree is large, and the root workspace stays fast.
[workspace]

[dependencies]
recall-core = { path = "../../crates/core", default-features = false }
rune = { git = "https://github.com/anomalyco/rune", rev = "77dd9132a8b64d0ef55b0e95ce4628bdfac47eeb", default-features = false, features = ["dbus", "embedded-fonts"] }
rune-kit = { git = "https://github.com/anomalyco/rune", rev = "77dd9132a8b64d0ef55b0e95ce4628bdfac47eeb", features = ["markdown"] }
# Anomaly's look (the OpenCode theme): kit tokens, the ember brand scale, Inter and IBM Plex Mono.
rune-theme-opencode = { git = "https://github.com/anomalyco/rune", rev = "77dd9132a8b64d0ef55b0e95ce4628bdfac47eeb" }

[dev-dependencies]
serde_json = "=1.0.154"

[profile.dev.package."*"]
debug = false
opt-level = 2
