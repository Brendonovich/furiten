[package]
name = "recall-hub"
description = "Recall's self-hosted hub: one library, synced to paired devices over Iroh"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "recall-hub"
path = "src/main.rs"

[dependencies]
clap = { version = "=4.6.7", features = ["derive"] }
iroh = { version = "=1.4.1", default-features = false, features = ["portmapper", "tls-ring"] }
qrcode = { version = "=0.14.1", default-features = false }
recall-core = { path = "../core", features = ["hub"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
tokio = { version = "=1.54.1", features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
