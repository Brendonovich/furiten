[package]
name = "recall"
description = "The Recall command line and local core"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "recall"
path = "src/main.rs"

[dependencies]
clap = { version = "=4.6.7", features = ["derive"] }
recall-core = { path = "../core" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
