[package]
name = "furiten"
description = "The Furiten command line and local core"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "furiten"
path = "src/main.rs"

[dependencies]
clap = { version = "=4.6.7", features = ["derive"] }
# `furiten host pair` prints the ticket as a QR code for the phone's camera, as `furiten-hub pair` does.
qrcode = { version = "=0.14.1", default-features = false }
furiten-core = { path = "../core" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
