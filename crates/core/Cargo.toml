[package]
name = "recall-core"
description = "Recall's store, review queue, sync client and local core server"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
getrandom = "=0.2.17"
recall-srs = { path = "../srs" }
rusqlite = { version = "=0.41.1", features = ["bundled"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
ureq = { version = "=3.5.0", default-features = false, features = ["rustls"] }
