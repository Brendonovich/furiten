[package]
name = "furiten-core"
description = "Furiten's store, review queue, sync client and local core server"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = ["hub", "import", "web"]
# Syncing with a self-hosted hub over Iroh. A process that only talks to a core can turn it off to skip Iroh's
# dependency tree.
hub = ["dep:iroh", "dep:tokio"]
# Reading other apps' exports (Mochi's `.mochi` zip). A process that only talks to a core sends just the path, so it
# can turn it off.
import = ["dep:zip"]
# Web access: the core serving the HTTP API (and the web app, when its host bundles it) to browsers on the
# network, with one access token. The desktop app turns it on; mobile builds leave it out.
web = ["dep:tiny_http"]

[dependencies]
getrandom = "=0.2.17"
iroh = { version = "=1.4.1", default-features = false, features = ["tls-ring"], optional = true }
furiten-srs = { path = "../srs" }
rusqlite = { version = "=0.41.1", features = ["bundled"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
# A small blocking HTTP/1.1 server for web access, matching the core's thread-per-connection style (no async
# runtime needed when the hub is off).
tiny_http = { version = "=0.12.0", optional = true }
tokio = { version = "=1.54.1", features = ["io-util", "macros", "rt-multi-thread", "sync", "time"], optional = true }
ureq = { version = "=3.5.0", default-features = false, features = ["rustls"] }
zip = { version = "=9.1.3", default-features = false, features = ["deflate-flate2-zlib-rs"], optional = true }
