name: release-macos

# Publishes Furiten for macOS from the Actions tab: bumps the version past the newest v* tag (or the crates' version,
# if that's newer), builds, signs and notarizes Furiten.dmg at that version, publishes it to Anomaly's release service
# (anoma.ly/release), and tags the commit v<version>. The version is set only in the build; nothing is committed.
# The run is the `release` environment, which is what the service's registry (anomalyco/release, registry/furiten.json)
# authorizes: this repository, this workflow file, refs/heads/dev, environment release, the desktop artifact's stable
# channel. The service's latest links never change:
#   https://anoma.ly/release/furiten/desktop/stable/macos-arm64-dmg    the DMG (302 to the current file)
#   https://anoma.ly/release/furiten/desktop/stable/macos-arm64        the updater zip (the app downloads it,
#                                                                      checks its SHA-256 and the app's
#                                                                      Developer ID, and swaps the bundle in)
on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump
        required: true
        default: patch
        type: choice
        options: [patch, minor, major]

# id-token is the release service's only credential: the job trades its OIDC token for a publish session.
permissions:
  contents: write
  id-token: write

concurrency:
  group: release-macos
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-26
    timeout-minutes: 90
    environment: release
    steps:
      - uses: actions/checkout@v7
      - run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            apps/desktop -> target
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
        working-directory: apps/web

      - name: Set the release version
        env:
          BUMP: ${{ inputs.bump }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          semver_max() { sort -t. -k1,1n -k2,2n -k3,3n | tail -n 1; }
          package_id="$(cargo pkgid --manifest-path apps/desktop/Cargo.toml -p furiten-desktop)"
          current="${package_id##*[@#]}"
          latest="$(gh api --paginate "repos/$GITHUB_REPOSITORY/tags?per_page=100" \
            --jq '.[].name | select(test("^v[0-9]+\\.[0-9]+\\.[0-9]+$")) | ltrimstr("v")' | semver_max)"
          if [[ -z "$latest" ]]; then
            # The first release is the version the crates already are.
            version="$current"
            base="$current"
          else
            base="$(printf '%s\n%s\n' "$current" "$latest" | semver_max)"
            IFS=. read -r major minor patch <<< "$base"
            case "$BUMP" in
              major) version="$((major + 1)).0.0" ;;
              minor) version="$major.$((minor + 1)).0" ;;
              patch) version="$major.$minor.$((patch + 1))" ;;
            esac
          fi
          # The desktop app's version, and the workspace's (the CLI and core beside it).
          VERSION="$version" perl -pi -e 's/^version = "[^"]+"/version = "$ENV{VERSION}"/' \
            Cargo.toml apps/desktop/Cargo.toml
          cargo metadata --format-version 1 >/dev/null
          cargo metadata --format-version 1 --manifest-path apps/desktop/Cargo.toml >/dev/null
          echo "RELEASE_VERSION=$version" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=v$version" >> "$GITHUB_ENV"
          echo "Furiten $version ($BUMP bump from $base)" >> "$GITHUB_STEP_SUMMARY"

      - uses: ./.github/actions/setup-apple-signing
        with:
          certificate-p12-base64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          certificate-password: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          api-key-p8-base64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
          api-key-id: ${{ secrets.APPLE_API_KEY_ID }}
          signing-identity: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      - name: Build, sign and notarize
        env:
          FURITEN_BUILD_NUMBER: ${{ github.run_number }}
          FURITEN_CHANNEL: production
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
        run: |
          set -euo pipefail
          app="$(apps/desktop/scripts/bundle.sh --notarize)"
          built="$(plutil -extract CFBundleShortVersionString raw "$app/Contents/Info.plist")"
          [[ "$built" == "$RELEASE_VERSION" ]] || { echo "Built $built, not $RELEASE_VERSION" >&2; exit 1; }
          # The updater accepts an update only if the unpacked app satisfies this requirement (src/updater/macos.rs
          # checks the same file), so the build must too: a wrong signing identity would ship an app that can never
          # update.
          codesign --verify --deep --strict -R="$(cat apps/desktop/assets/update-requirement.txt)" "$app"
          ls -l apps/desktop/target/release/bundle/dmg

      - name: Remove the signing keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2>/dev/null || true

      - name: Publish to the release service
        env:
          RELEASE: https://anoma.ly/release
        run: |
          set -euo pipefail
          arch="$(uname -m)"
          [[ "$arch" == arm64 ]] || arch=x86_64
          dmg=apps/desktop/target/release/bundle/dmg
          jq -n --arg channel stable --arg version "$RELEASE_VERSION" '{channel: $channel, version: $version}' \
            > "$RUNNER_TEMP/release.json"
          # The client opens a publish session with the job's OIDC token, uploads (content-addressed, in parts when
          # large), publishes, and checks the published files' sizes and hashes.
          curl -fsSL "$RELEASE/client.sh" | bash -s -- publish \
            --app furiten --artifact desktop --release "$RUNNER_TEMP/release.json" \
            --target "macos-arm64=$dmg/Furiten-$RELEASE_VERSION-macos-$arch.zip" \
            --target "macos-arm64-dmg=$dmg/Furiten.dmg=Furiten.dmg" \
            --out "$RUNNER_TEMP/manifest.json" --verify-downloads
          cat "$RUNNER_TEMP/manifest.json"

      - name: Verify the published release
        run: |
          set -euo pipefail
          arch="$(uname -m)"
          [[ "$arch" == arm64 ]] || arch=x86_64
          zip="apps/desktop/target/release/bundle/dmg/Furiten-$RELEASE_VERSION-macos-$arch.zip"
          info="$(curl -fsSL "https://anoma.ly/release/furiten/desktop/stable/macos-arm64/info")"
          # What was published is what was built: the same version, size and SHA-256.
          [[ "$(jq -r .version <<<"$info")" == "$RELEASE_VERSION" ]] ||
            { echo "The published release is $(jq -r .version <<<"$info"), not $RELEASE_VERSION." >&2; exit 1; }
          shasum="$(shasum -a 256 "$zip" | cut -d' ' -f1)"
          [[ "$shasum" == "$(jq -r .sha256 <<<"$info")" ]] ||
            { echo "The published zip's SHA-256 differs from the built one." >&2; exit 1; }
          # And what a download gets is what the updater verifies: unpack the published file and check it the way
          # src/updater/macos.rs does.
          rm -rf "$RUNNER_TEMP/published" && mkdir -p "$RUNNER_TEMP/published"
          curl -fsSL -o "$RUNNER_TEMP/published.zip" "https://anoma.ly/release/furiten/desktop/stable/macos-arm64"
          [[ "$(shasum -a 256 "$RUNNER_TEMP/published.zip" | cut -d' ' -f1)" == "$shasum" ]]
          ditto -x -k "$RUNNER_TEMP/published.zip" "$RUNNER_TEMP/published"
          codesign --verify --deep --strict -R="$(cat apps/desktop/assets/update-requirement.txt)" \
            "$RUNNER_TEMP/published/Furiten.app"
          published="$(plutil -extract CFBundleShortVersionString raw \
            "$RUNNER_TEMP/published/Furiten.app/Contents/Info.plist")"
          [[ "$published" == "$RELEASE_VERSION" ]] ||
            { echo "The published app is $published, not $RELEASE_VERSION." >&2; exit 1; }
          echo "The published release satisfies the updater's requirement." >> "$GITHUB_STEP_SUMMARY"

      - name: Tag the release
        run: |
          set -euo pipefail
          git tag "$RELEASE_TAG" "$GITHUB_SHA"
          git push origin "$RELEASE_TAG"
