name: build-macos

# Builds Furiten.app, signed with the Developer ID and notarized, as a DMG artifact: on every push to dev that touches
# the app, or from the Actions tab. release-macos publishes one.
on:
  push:
    branches: [dev]
    paths:
      - apps/desktop/**
      - apps/web/**
      - crates/**
      - Cargo.lock
      - Cargo.toml
      - .github/actions/setup-apple-signing/**
      - .github/workflows/build-macos.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-macos-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            apps/desktop -> target
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
        working-directory: apps/web
      - uses: ./.github/actions/setup-apple-signing
        with:
          certificate-p12-base64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          certificate-password: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          api-key-p8-base64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
          api-key-id: ${{ secrets.APPLE_API_KEY_ID }}
          signing-identity: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      - name: Build, sign and notarize
        env:
          FURITEN_BUILD_NUMBER: ${{ github.run_number }}
          # A build from a production branch is a release build; everything else is a dev build, with the dev icon.
          FURITEN_CHANNEL: ${{ github.ref_name == 'production' && 'production' || 'dev' }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
        run: apps/desktop/scripts/bundle.sh --notarize
      - uses: actions/upload-artifact@v7
        with:
          name: furiten-macos-${{ runner.arch }}
          path: apps/desktop/target/release/bundle/dmg/Furiten.dmg
          if-no-files-found: error
          retention-days: 14
      - name: Remove the signing keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2>/dev/null || true
